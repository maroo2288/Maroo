name: build-admin
on:
  push:
    branches: [main]
    paths: ["index.html", "build_admin.py"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build_admin.py
      - name: commit admin build
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add admin/index.html
          git diff --cached --quiet || (git commit -m "rebuild admin app" && git push)
